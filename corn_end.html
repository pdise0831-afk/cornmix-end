<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141A33">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>콘 믹스 도우미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#141A33;--ink2:#1D2547;--ink3:#28315C;--line:#3A4478;--corn:#F2C14E;--husk:#E9E4D0;--mute:#9AA2C8;--drop:#5FD3C4;--need:#FF7A8A;--junk:#F2C14E;--own:#8C93B8;--pt:#B99CFF;--gp:#7FD67A;--r:10px;--onCorn:#141A33}
[data-theme=light]{--ink:#F3F1EA;--ink2:#FFFFFF;--ink3:#E7E3D6;--line:#CFC8B4;--corn:#B57E10;--husk:#1C2140;--mute:#6A6F8C;--drop:#0F8F84;--need:#C93450;--junk:#9A6A00;--own:#7B809C;--pt:#6A44D0;--gp:#2E8A2A;--onCorn:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink);color:var(--husk);font-family:"IBM Plex Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.5}
body{min-height:100vh;background:radial-gradient(1200px 500px at 110% -10%,rgba(242,193,78,.10),transparent 60%),var(--ink)}
.wrap{max-width:1000px;margin:0 auto;padding:16px 14px 110px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;border-bottom:2px solid var(--corn);padding-bottom:10px;margin-bottom:14px}
.brand{font-family:"Black Han Sans",sans-serif;font-size:28px;color:var(--corn);line-height:1}
.brand small{display:block;font-family:"IBM Plex Sans KR";font-size:12px;color:var(--mute);margin-top:6px;font-weight:500}
.hdr-r{margin-left:auto;display:flex;gap:6px;align-items:center}
.stamp{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--mute);text-align:right;line-height:1.35}
.mono{font-family:"JetBrains Mono",monospace}
.search{position:relative;display:flex;gap:6px}
.search .in{position:relative;flex:1}
.search input{width:100%;padding:13px 14px 13px 40px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--ink2);color:var(--husk);font-size:16px;font-family:inherit;outline:none}
.search input:focus{border-color:var(--corn)}
.search .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mute)}
.sugg{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 4px);background:var(--ink2);border:1.5px solid var(--line);border-radius:var(--r);max-height:60vh;overflow:auto;display:none;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.sugg.on{display:block}
.sugg button{display:flex;width:100%;align-items:center;gap:10px;padding:9px 12px;background:none;border:0;border-bottom:1px solid var(--ink3);color:var(--husk);text-align:left;font:inherit;cursor:pointer}
.sugg button:hover,.sugg button.act{background:var(--ink3)}
.face{width:30px;height:30px;border-radius:7px;background:var(--ink3);object-fit:cover;flex:none}
.face.sm{width:24px;height:24px;border-radius:5px}
.tag{font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid currentColor;white-space:nowrap;font-weight:500}
.tag.drop{color:var(--drop)}.tag.mix{color:var(--corn)}.tag.no{color:var(--mute)}.tag.need{color:var(--need)}
.lv{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--mute)}
.pt{color:var(--pt)}.gp{color:var(--gp)}
.target{margin-top:14px;display:none;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--ink2);border:1.5px solid var(--line);border-radius:14px;padding:14px}
.target.on{display:grid}
.target>img{width:60px;height:60px;border-radius:12px;background:var(--ink3);object-fit:cover}
.target h2{margin:0;font-family:"Black Han Sans";font-weight:400;font-size:25px;line-height:1.1}
.target .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.trail{margin-top:12px;display:flex;align-items:center;gap:8px;min-width:0}
.trail .back{flex:none;max-width:45%;overflow:hidden;text-overflow:ellipsis}
.crumbs{display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;white-space:nowrap}
.crumbs::-webkit-scrollbar{display:none}
.crumb{display:inline-flex;align-items:center;gap:5px;background:none;border:0;color:var(--mute);font:inherit;font-size:12.5px;padding:3px 4px;cursor:pointer;border-radius:6px}
.crumb:hover{color:var(--husk);background:var(--ink3)}
.crumb.now{color:var(--corn);font-weight:700;cursor:default}
.crumb .face{width:20px;height:20px}
.lineage{grid-column:1/-1;display:grid;gap:6px;border-top:1px dashed var(--line);padding-top:10px}
.lrow{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;min-width:0}
.ltag{font-size:11.5px;font-weight:700;white-space:nowrap}
.ltag.dn{color:var(--drop)}.ltag.up{color:var(--corn)}
.lscroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.lscroll::-webkit-scrollbar{display:none}
.lscroll .chip{flex:none}
.fav{background:none;border:1.5px solid var(--line);color:var(--mute);border-radius:9px;font-size:18px;width:40px;height:40px;cursor:pointer}
.fav.on{color:var(--corn);border-color:var(--corn)}
.kpis{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.kpi{background:var(--ink);border-radius:9px;padding:8px 10px;border-left:3px solid var(--line);min-width:0}
.kpi b{display:block;font-family:"JetBrains Mono";font-size:20px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{font-size:11.5px;color:var(--mute)}
.kpi.k1{border-color:var(--drop)}.kpi.k1 b{color:var(--drop)}
.kpi.k2{border-color:var(--need)}.kpi.k2 b{color:var(--need)}
.kpi.k3{border-color:var(--junk)}.kpi.k3 b{color:var(--junk)}
.kpi.k5{border-color:var(--pt)}.kpi.k5 b{color:var(--pt)}
.progress{grid-column:1/-1;height:6px;background:var(--ink);border-radius:9px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--drop),var(--corn));width:0;transition:width .3s}
.tabs{display:flex;gap:2px;margin:16px 0 0;border-bottom:1.5px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;color:var(--mute);font:inherit;font-weight:700;padding:10px 13px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1.5px;white-space:nowrap}
.tabs button.on{color:var(--corn);border-color:var(--corn)}
.panel{display:none;padding-top:14px}.panel.on{display:block}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:9px;overflow:hidden;flex-wrap:nowrap}
.seg button{background:none;border:0;color:var(--mute);font:inherit;font-size:13px;padding:7px 10px;cursor:pointer;border-right:1px solid var(--line);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--corn);color:var(--onCorn);font-weight:700}
.btn{background:var(--ink3);border:1.5px solid var(--line);color:var(--husk);font:inherit;font-size:13px;padding:7px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--corn)}
.btn.pri{background:var(--corn);color:var(--onCorn);border-color:var(--corn);font-weight:700}
.btn.sm{padding:4px 9px;font-size:12px}
select.ctl,input.ctl{background:var(--ink2);color:var(--husk);border:1.5px solid var(--line);border-radius:9px;font:inherit;font-size:13px;padding:7px 9px}
.hint{font-size:12.5px;color:var(--mute);margin:4px 0 12px}
.note{border:1.5px solid var(--corn);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px;background:rgba(242,193,78,.06)}
.mgroup{margin-bottom:18px}
.mgroup h3{font-size:14px;margin:0 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mgroup h3 i{width:10px;height:10px;border-radius:3px;display:inline-block}
.mgroup h3 .sub{margin-left:auto;font-weight:500}
.mt{width:100%;border-collapse:separate;border-spacing:0 5px}
.mt td{background:var(--ink2);padding:6px 8px;border-top:1px solid var(--ink3);border-bottom:1px solid var(--ink3);vertical-align:middle}
.mt td:first-child{border-left:1px solid var(--ink3);border-radius:9px 0 0 9px}
.mt td:last-child{border-right:1px solid var(--ink3);border-radius:0 9px 9px 0}
.mt th{font-size:11px;color:var(--mute);font-weight:500;text-align:left;padding:0 8px}
.mt .num{text-align:right;font-family:"JetBrains Mono";white-space:nowrap}
.mt tr.done td{opacity:.45}
.mt tr.done .nmc b{text-decoration:line-through}
.nmc{display:flex;align-items:center;gap:8px;min-width:0}
.nmc b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.need-n{font-family:"JetBrains Mono";font-weight:700;font-size:15px}
.stp{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stp button{background:var(--ink3);border:0;color:var(--husk);width:28px;height:28px;font-size:15px;cursor:pointer}
.stp input{width:38px;text-align:center;background:var(--ink);border:0;color:var(--husk);font-family:"JetBrains Mono";font-size:13px;height:28px;-moz-appearance:textfield}
.stp input::-webkit-inner-spin-button{display:none}
.px{font-size:12px}
.px input{width:72px;background:var(--ink);border:1px dashed var(--line);color:var(--husk);border-radius:6px;font-family:"JetBrains Mono";font-size:12px;padding:3px 5px;text-align:right}
.px small{display:block;color:var(--mute);font-size:10.5px}
.empty{color:var(--mute);font-size:13px;padding:10px;border:1px dashed var(--line);border-radius:9px}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-bottom:14px}
.tot{background:var(--ink2);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.tot b{font-family:"JetBrains Mono";font-size:22px;display:block}
.tot span{font-size:12px;color:var(--mute)}
.step{display:grid;grid-template-columns:34px 1fr;gap:10px;background:var(--ink2);border:1px solid var(--ink3);border-radius:11px;padding:10px 12px;margin-bottom:7px;cursor:pointer}
.step .no{font-family:"JetBrains Mono";font-weight:700;color:var(--corn);font-size:15px;padding-top:2px}
.step.done{opacity:.4}.step.done .no{color:var(--drop)}
.step.final{border-color:var(--corn)}
.formula{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.hn{display:inline-flex;align-items:center;gap:6px}
.op{color:var(--mute);font-family:"JetBrains Mono"}
.res{font-weight:700;color:var(--corn)}
.need{font-size:12px;color:var(--mute);margin-top:4px}
.need b{color:var(--junk)}
.pl{font-family:"JetBrains Mono";font-size:11.5px;padding:1px 6px;border-radius:6px;background:var(--ink3);color:var(--husk)}
.pl.up{color:var(--corn)}.pl.hw{color:var(--drop)}
.gr{font-family:"JetBrains Mono";font-size:11px;color:var(--mute)}
.tree{font-size:14px}
.tn{margin-left:14px;border-left:1.5px dashed var(--line);padding-left:12px}
.tree>.tn{margin-left:0;border-left:0;padding-left:0}
.row{display:flex;align-items:center;gap:7px;padding:5px 0;flex-wrap:wrap}
.row .role{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--ink3);color:var(--mute)}
.row .role.m{color:var(--corn)}.row .role.s{color:var(--drop)}
.row select{background:var(--ink2);color:var(--husk);border:1px solid var(--line);border-radius:7px;font:inherit;font-size:12px;padding:3px 6px;max-width:260px}
.st{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.st button{background:none;border:0;color:var(--mute);font:inherit;font-size:11.5px;padding:3px 8px;cursor:pointer;border-right:1px solid var(--line)}
.st button:last-child{border-right:0}
.st button.on{background:var(--ink3);color:var(--husk);font-weight:700}
.row.owned .nmx{text-decoration:line-through;color:var(--own)}
.row input.olv{width:58px;background:var(--ink);border:1px solid var(--line);color:var(--husk);border-radius:6px;font-family:"JetBrains Mono";font-size:12px;padding:2px 4px}
.tog{background:none;border:0;color:var(--mute);cursor:pointer;font-family:"JetBrains Mono";width:18px;padding:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{background:var(--ink2);border:1px solid var(--ink3);border-radius:10px;padding:10px 12px}
.field label{font-size:12px;color:var(--mute);display:block;margin-bottom:4px}
.field input,.field select{width:100%;background:var(--ink);border:1px solid var(--line);color:var(--husk);border-radius:7px;padding:8px;font:inherit}
.out{grid-column:1/-1;background:var(--ink);border:1.5px solid var(--corn);border-radius:12px;padding:14px;display:flex;gap:18px;flex-wrap:wrap;align-items:baseline}
.out b{font-family:"JetBrains Mono";font-size:28px;color:var(--corn)}
.mapc{background:var(--ink2);border:1px solid var(--ink3);border-radius:11px;padding:10px 12px;margin-bottom:8px}
.mapc h4{margin:0 0 6px;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mapc .rk{font-family:"JetBrains Mono";color:var(--corn)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--ink3);border-radius:99px;padding:2px 9px 2px 3px;font-size:12.5px;cursor:pointer;border:0;color:var(--husk);font-family:inherit}
.chip .face{width:20px;height:20px;border-radius:99px}
.chip.got{opacity:.4;text-decoration:line-through}
.welcome{margin-top:20px;border:1.5px dashed var(--line);border-radius:14px;padding:20px;color:var(--mute)}
.welcome h3{color:var(--husk);margin:0 0 8px;font-size:16px}
.welcome .chips{margin-top:10px}
.ptbl{width:100%;border-collapse:collapse;font-size:13px}
.ptbl th,.ptbl td{padding:6px 8px;border-bottom:1px solid var(--ink3);text-align:left}
.ptbl th{color:var(--mute);font-weight:500;font-size:11.5px;position:sticky;top:0;background:var(--ink)}
.ptbl td.n{text-align:right;font-family:"JetBrains Mono"}
.scroll{max-height:65vh;overflow:auto;border:1px solid var(--ink3);border-radius:10px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(30px);background:var(--corn);color:var(--onCorn);font-weight:700;padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.fab{position:fixed;right:16px;bottom:18px;z-index:40;display:none;gap:6px}
.fab.on{display:flex}
.fab button{border-radius:99px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--corn);outline-offset:2px}
.hide-m{}
@media (max-width:700px){
  .kpis{grid-template-columns:repeat(3,1fr)}.kpi b{font-size:17px}
  .grid2{grid-template-columns:1fr}.brand{font-size:23px}.target h2{font-size:21px}
  .target{grid-template-columns:auto 1fr auto;padding:12px}.target>img{width:48px;height:48px}
  .hide-m{display:none}
  .tabs{position:sticky;top:0;z-index:20;background:var(--ink);margin-left:-14px;margin-right:-14px;padding:0 8px}
  .mt,.mt tbody{display:block}.mt thead{display:none}
  .mt tr{display:grid;grid-template-columns:1fr 1fr;background:var(--ink2);border:1px solid var(--ink3);border-radius:10px;margin-bottom:6px;padding:6px 8px;gap:4px 8px}
  .mt td{display:block;background:none;border:0!important;padding:0;border-radius:0!important}
  .mt td:first-child{grid-column:1/-1}.mt td.num{grid-column:1/-1;text-align:right}
  .mt td[data-l]::before{content:attr(data-l);display:block;font-size:10.5px;color:var(--mute)}
  .stp button{width:32px;height:30px}
  .seg button{padding:7px 8px;font-size:12.5px}
  .fab{left:0;right:0;bottom:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--ink);border-top:1.5px solid var(--line);justify-content:flex-end}
  .fab button{box-shadow:none;flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.sumcard{background:var(--ink2);border:1.5px solid var(--corn);border-radius:14px;padding:12px;margin-bottom:10px}
.sc-main b{font-family:"JetBrains Mono";font-size:34px;color:var(--corn)}
.sc-main b small{font-size:15px;color:var(--husk)}
.sc-main span{display:block;font-size:12.5px;color:var(--mute)}
.sc-cmp{display:flex;gap:8px;align-items:baseline;border-top:1px dashed var(--line);padding-top:8px;flex-wrap:wrap}
.sc-cmp b{font-family:"JetBrains Mono";font-size:18px}
.sb{font-family:"JetBrains Mono";font-size:11.5px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--ink3);color:var(--husk);white-space:nowrap}
.sb.s5{background:var(--corn);color:var(--onCorn)}
.sb.s4{color:var(--corn);border:1px solid var(--corn)}
.sb.s2{color:var(--mute)}.sb.s1{color:var(--drop)}
.glist{display:grid;gap:8px}
.gstep{display:grid;grid-template-columns:30px 1fr;gap:8px;background:var(--ink2);border:1px solid var(--ink3);border-radius:11px;padding:10px 12px}
.gstep.now{border-color:var(--corn)}
.gstep.final{border-color:var(--drop)}
.gstep .no{font-family:"JetBrains Mono";font-weight:700;color:var(--corn)}
.gstep.evo .no{color:var(--drop)}
.gact{margin-top:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.jsub{margin-top:6px}
.jsub summary{cursor:pointer;color:var(--mute);font-size:12.5px}
.js{display:flex;gap:6px;align-items:center;padding:3px 0;flex-wrap:wrap;cursor:pointer;font-size:13px}
.js.done{opacity:.45;text-decoration:line-through}
.tag.evo{color:var(--drop)}.tag.f5{color:var(--corn);font-weight:700}
.done-all{border:1.5px solid var(--drop);background:rgba(95,211,196,.08);border-radius:12px;padding:12px;margin-bottom:10px;font-weight:700}
.ivr{background:var(--ink2);border:1px solid var(--ink3);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.ivr.has{border-color:var(--corn)}
.ivr .ivi{margin:4px 0}
.ivs{display:flex;flex-wrap:wrap;gap:6px}
.ivc{display:inline-flex;align-items:center;gap:3px}
.ivc .stp input{width:30px;height:26px}
.logbox{border:1.5px solid var(--corn);border-radius:12px;padding:10px;margin-bottom:10px;background:var(--ink2)}
.lbh{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.lbh b{display:block}
.lbg{display:grid;gap:6px}
.lbc{display:flex;gap:8px;align-items:center;border-top:1px solid var(--ink3);padding-top:6px}
.lbc>div{margin-left:auto}
.mdet{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px}
.mdet span{font-size:12px;color:var(--mute)}
.chip.sel{outline:2px solid var(--corn)}
.gainbox{border:1.5px solid var(--corn);border-radius:12px;padding:10px;background:rgba(242,193,78,.05)}
.rules{background:var(--ink2);border:1px solid var(--ink3);border-radius:12px;padding:10px 12px;margin-top:12px}
.rules summary{cursor:pointer;font-weight:700}
.rules ul{margin:8px 0 0;padding-left:18px;font-size:13px}
.rules li{margin-bottom:4px}
.rules code{font-family:"JetBrains Mono";font-size:12px;color:var(--corn)}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="brand">콘 믹스 도우미<small>Corn Project 믹스 연구소 · 마켓 시세 · 몬스터 정보 기반</small></div>
  <div class="hdr-r"><div class="stamp">헨치 <span id="cntM"></span>종 · 공식 <span id="cntX"></span>개<br>시세 <span id="cntP"></span>종 · 데이터 <span id="dstamp"></span></div>
  <button class="btn sm" id="theme" aria-label="밝은/어두운 화면 전환">화면 전환</button></div>
</header>
<div class="search"><div class="in">

function runPlan(){const tg=Math.max(lvl(cur),Math.min(maxLv(cur),+$('#pt').value||maxLv(cur))),cap=Math.max(1,Math.min(2000,+$('#pc').value||180)),hw=Math.max(0,+$('#pw').value||0);

function planCard(s,no){const n=s.n,isLast=no===PLAN.steps.length;

function priceBox(id){const e=PR[id];if(!e)return '<div class="empty">최근 3개월 마켓 거래 기록이 없어요.</div>';

const today=()=>new Date().toISOString().slice(0,10);
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function matText(){const U=curU();let t=`[${nm(cur)}${qty()>1?' ×'+qty():''}] 필요 재료 (스마트 가이드, ${MODES.find(m=>m[1]===S.mode)[0]}, ${BASIS[S.basis][1]})\n`;
  const sec=(title,rs)=>{if(!rs.length)return;t+=`\n■ ${title}\n`;rs.forEach(r=>{t+=`- ${nm(r.id)} Lv.${lvl(r.id)} : `+[r.f?`5성 ${r.hf}/${r.f}`:'',r.j?`잡성 ${r.hj}/${r.j}`:''].filter(Boolean).join(', ')+(r.cost?` · 남은 ${fmt(r.cost)}${U}`:r.miss?' · 시세 없음':'')+'\n'})};
  sec('필드 드랍',ROWS.filter(r=>r.kind==='drop'));sec('직접 구함(드랍 불가)',ROWS.filter(r=>r.kind==='need'));
  t+=`\n남은 비용: ${fmt(COST.cost)} ${U} / 전체 ${fmt(COST.costAll)} ${U}${COST.miss?` (시세 없는 ${COST.miss}종 제외)`:''}\n모은 재료: ${COST.have}/${COST.need} · 믹스·진화 ${SM.steps}회`;return t}

function loadXLSX(){return window.XLSX?Promise.resolve(window.XLSX):new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=()=>res(window.XLSX);s.onerror=rej;document.head.appendChild(s)})}
function sheets(){const U=curU();
  const mat=[[`${nm(cur)}${qty()>1?' ×'+qty():''} 필요 재료`,'',`${MODES.find(m=>m[1]===S.mode)[0]} · ${BASIS[S.basis][1]} · ${today()}`],[],['구분','헨치','기본Lv','5성 필요','5성 보유','5성 남음',`5성 단가(${U})`,'잡성 필요','잡성 보유','잡성 남음',`잡성 단가(${U})`,`남은 금액(${U})`,`전체 금액(${U})`,'출현 맵']];
  ROWS.forEach(r=>mat.push([r.kind==='drop'?'필드 드랍':'직접 구함',nm(r.id),lvl(r.id),r.f,r.hf,r.rf,r.p5?r.p5.v:'',r.j,r.hj,r.rj,r.pj?r.pj.v:'',r.cost,(r.f&&r.p5?r.f*r.p5.v:0)+(r.j&&r.pj?r.j*r.pj.v:0),(LOCH[r.id]||[]).map(x=>LOCM[x[0]]).join(', ')]));
  mat.push([],['합계','','',ROWS.reduce((a,r)=>a+r.f,0),ROWS.reduce((a,r)=>a+r.hf,0),ROWS.reduce((a,r)=>a+r.rf,0),'',ROWS.reduce((a,r)=>a+r.j,0),ROWS.reduce((a,r)=>a+r.hj,0),ROWS.reduce((a,r)=>a+r.rj,0),'',COST.cost,COST.costAll]);
  if(COST.miss)mat.push([`※ 시세가 없는 재료 ${COST.miss}종은 금액에 포함되지 않았어요.`]);
  const st=[['번호','작업','메인','메인 별','서브','서브 별','결과','결과 별','잡성 처리']];SM.P.steps.forEach((x,i)=>{if(x.t==='mix')st.push([i+1,'믹스',x.n.main.name,starW(x.a),x.n.sub.name,starW(x.b),x.n.name,'★'+x.s,'']);else{st.push([i+1,'진화',x.n.name,'★'+x.from,'','',x.n.name,'★'+x.to,x.jc.t==='mix'?'잡성 만들기':x.jc.t==='spare'?'보유분':x.jc.t==='hunt'?'사냥':'구함']);if(x.jc.t==='mix')x.jc.sub.forEach((y,k)=>st.push([`${i+1}-${k+1}`,y.t==='mix'?'잡성용 믹스':'잡성용 진화',y.t==='mix'?y.n.main.name:y.n.name,'',y.t==='mix'?y.n.sub.name:'','',y.n.name,'★'+(y.s||y.to),'']))}});
  const A=mapAgg(),mp=[['순위','맵','남은 종류','남은 마리','헨치(남은 수량)']];A.maps.filter(m=>m.kinds>0).forEach((m,i)=>mp.push([i+1,LOCM[m.mi],m.kinds,m.rem,m.items.filter(x=>x.rem>0).map(x=>`${nm(x.id)}×${x.rem}`).join(', ')]));
  const out=[['재료·비용',mat,[10,16,7,8,8,8,11,8,8,8,11,13,13,40]],['믹스 가이드',st,[6,10,16,8,16,8,16,8,12]],['사냥 맵',mp,[6,24,9,9,60]]];
  if(PLAN&&PLAN.steps){const pl=[[`목표 Lv.${PLAN.L}`,`육성 합계 ${PLAN.ups}`,`성수 ${PLAN.hw}`,`믹스 ${PLAN.mixes}`],[],['번호','작업','헨치','시작Lv','최종Lv','성수','메인Lv','서브Lv','사용처']];
    PLAN.steps.forEach((s,i)=>pl.push([i+1,s.src==='mix'?'믹스':s.src==='own'?'보유':s.n.core>0?'사냥':'구함',s.n.name,s.from,s.L,s.hw,s.lm||'',s.ls||'',s.parent?`${s.parent.name} ${s.role==='m'?'메인':'서브'}`:'최종']));out.push(['레벨 플랜',pl,[6,8,16,8,8,6,8,8,22]])}
  return out}
function exportXlsx(){toast('엑셀 파일을 만드는 중…');loadXLSX().then(X_=>{const wb=X_.utils.book_new();sheets().forEach(([n,a,w])=>{const ws=X_.utils.aoa_to_sheet(a);ws['!cols']=w.map(x=>({wch:x}));X_.utils.book_append_sheet(wb,ws,n)});
